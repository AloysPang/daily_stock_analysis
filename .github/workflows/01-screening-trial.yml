name: 选股试跑（LLM）

# 手动触发的选股试跑：策略由手动触发时选择，市场 cn，最多 20 只，
# 带 LLM 二次重排（Gemini）。只跑一次，不设定时；结果上传为 Actions 构件。
on:
  workflow_dispatch:
    inputs:
      strategy:
        description: '本次运行要用的选股策略'
        type: choice
        default: oversold_reversal
        options:
          - dual_low
          - quality_value
          - blue_chip_income
          - low_volatility_quality
          - capital_heat
          - momentum_quality
          - shrink_pullback
          - volume_breakout
          - oversold_reversal
          - balanced_alpha

concurrency:
  group: screening-trial
  cancel-in-progress: false

jobs:
  screen-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # requirements.txt 未直接声明 pyyaml / pydantic，本地试跑时需补装
          pip install pyyaml pydantic

      - name: 创建必要目录
        run: |
          mkdir -p data logs screening-trial

      - name: 选股试跑（手动触发时选择的策略 + LLM 重排）
        env:
          SCREENING_ENABLED: 'true'
          SCREENING_DATA_DIR: ${{ github.workspace }}/data
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: gemini/gemini-3-flash-preview
          LLM_MAX_TOKENS: '8192'
          LLM_TIMEOUT_SEC: '120'
          # Gemini only; no fallback model
          run: python .github/scripts/run_screening_trial.py "${{ inputs.strategy }}"
          
      - name: 上传选股结果
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screening-trial-llm-${{ github.run_number }}
          path: screening-trial/
          retention-days: 30

      - name: 显示运行结果
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "📊 选股试跑完成"
          echo "=========================================="
          if [ -f "screening-trial/result.json" ]; then
            ls -la screening-trial/
            python -c "import json; d=json.load(open('screening-trial/result.json')); print('llm_ranked=', d.get('llm_ranked'), 'ranking_mode=', d.get('ranking_mode'), 'model=', d.get('llm_model_used'), 'picks=', len(d.get('picks', [])))"
          else
            echo "⚠️ 未生成 result.json"
          fi
