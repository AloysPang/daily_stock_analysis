name: 选股试跑（LLM）

# 手动触发的选股试跑：策略 oversold_reversal（超跌反转），市场 cn，最多 20 只，
# 带 LLM 二次重排（Gemini）。只跑一次，不设定时；结果上传为 Actions 构件。
on:
  workflow_dispatch:

concurrency:
  group: screening-trial
  cancel-in-progress: false

jobs:
  screen-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # requirements.txt 未直接声明 pyyaml / pydantic，本地试跑时需补装
          pip install pyyaml pydantic

      - name: 创建必要目录
        run: |
          mkdir -p data logs screening-trial

      - name: 选股试跑（oversold_reversal + LLM 重排）
        env:
          SCREENING_ENABLED: 'true'
          SCREENING_DATA_DIR: ${{ github.workspace }}/data
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: gemini/gemini-3-flash-preview
          LLM_MAX_TOKENS: '8192'
          LLM_TIMEOUT_SEC: '120'
          LLM_CHANNELS: relay
          LLM_RELAY_BASE_URL: https://gsykj.com/v1
          LLM_RELAY_API_KEY: ${{ secrets.RELAY_API_KEY }}
          LLM_RELAY_MODELS: gpt-5.5
          LITELLM_FALLBACK_MODELS: openai/gpt-5.5
        run: |
          python - <<'PYEOF'
          import json
          import time
          from dataclasses import asdict
          from src.services.screening.config import Config
          from src.services.screening.pipeline import screen

          t0 = time.time()
          cfg = Config.from_env()
          print(f"LLM model: {cfg.llm_model}")
          print(f"LLM configured: {cfg.has_llm_config()}  key_set={'yes' if cfg.llm_api_key else 'no'}")

          result = screen(
            "oversold_reversal",
            market="cn",
            max_output=20,
            use_llm=True,
          )

          elapsed = time.time() - t0
          print(f"筛选完成：llm_ranked={result.llm_ranked}")
          print(f"覆盖度 llm_coverage={result.llm_coverage:.2%}")
          print(f"ranking_mode={result.ranking_mode}")
          for i, r in enumerate(result.results, 1):
            print(f"{i:>2}. {r.code} {r.name} 综合分={r.score:.1f}")
          print(f"耗时 {elapsed:.1f}s")

          with open("screening-trial/result.json", "w", encoding="utf-8") as f:
            json.dump(asdict(result), f, ensure_ascii=False, indent=2)
          PYEOF

      - name: 上传结果构件
        uses: actions/upload-artifact@v4
        with:
          name: screening-trial-result
          path: screening-trial/result.json
          if-no-files-found: error
          retention-days: 7
